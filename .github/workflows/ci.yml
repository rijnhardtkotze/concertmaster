name: ci

on:
  pull_request:
  push:
    branches: [main]
  # dependabot-changelog.yml starts this after it commits a fragment to a Dependabot pull
  # request: a push made with GITHUB_TOKEN starts no pull_request run without approval.
  workflow_dispatch:
    inputs:
      base_ref:
        description: "The pull request's base branch, such as v2"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run check-secrets

  changelog:
    # Every pull request adds at least one changie fragment. No exceptions, no skip label.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a new fragment in .changes/unreleased/
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref }}
        run: |
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '.changes/unreleased/*.yaml')
          if [ -z "$added" ]; then
            echo "::error::Add a changelog fragment: pnpm run change --kind <Added|Changed|Deprecated|Removed|Fixed|Security> --body \"...\""
            exit 1
          fi
          echo "Fragments added:"
          echo "$added"
      - name: Validate every unreleased fragment
        run: |
          # changie rejects malformed YAML and unknown kinds. It accepts an empty body, so check that too.
          npx --yes "changie@$(node -p "require('./package.json').devDependencies.changie")" batch v0.0.0 --dry-run > /dev/null
          node -e '
            const fs = require("fs");
            const empty = [];
            for (const f of fs.readdirSync(".changes/unreleased").filter((n) => n.endsWith(".yaml"))) {
              const text = fs.readFileSync(`.changes/unreleased/${f}`, "utf8");
              const m = text.match(/^body:[ \t]*(.*)$/m);
              let body = m ? m[1].trim() : "";
              if (/^[|>][-+]?$/.test(body)) {
                const after = text.slice(text.indexOf(m[0]) + m[0].length).split("\n").slice(1);
                body = (after.find((l) => /^\s+\S/.test(l)) ?? "").trim();
              }
              if (!body.replace(/^["\x27]+|["\x27]+$/g, "").trim()) empty.push(f);
            }
            if (empty.length) {
              console.log(`::error::Give these fragments a body: ${empty.join(", ")}`);
              process.exit(1);
            }
          '

  golden:
    # Live extraction over tests/golden/cases (two calls per case, on the subscription
    # or a few cents of API). Per-field table lands in the job summary.
    #
    # This job runs the PR's own code with the extraction credentials (your Claude
    # subscription token) in its environment, so it only runs for PRs opened by the
    # repository owner. Fork PRs never get secrets anyway; this also keeps them from
    # collaborators' and bots' PRs. (Anyone with write access can still edit this file,
    # so grant write access only to people you'd trust with the token.)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.author_association == 'OWNER'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run golden -- --require-baseline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
